<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Sets the character encoding -->
  <meta charset="UTF-8">

  <!-- Helps the webpage display correctly on different screen sizes -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Sets the title shown in the browser tab -->
  <title>School Lunch App</title>

  <!-- Connects the CSS file -->
  <link rel="stylesheet" href="style.css">

  <!-- Connects the JavaScript file -->
  <script src="script.js" defer></script>
</head>

<body>
  <!-- Page 1: Home Screen Container -->
  <div id="home-screen" class="screen">
    <!-- Displays the main application title from your design -->
    <h1 class="app-title">SCHOOL LUNCH APP</h1>

    <!-- Button that navigates to Page 2 when clicked -->
    <button id="order-btn" class="order-button">ORDER HERE</button>
  </div>

  <!-- Page 2: Menu Selection Screen (starts hidden) -->
  <div id="menu-select-screen" class="screen hidden">
    <h2 class="section-title">ORDER LUNCH</h2>
    <p>Choose a menu option below:</p>
<!-- Feedback message when a restricted menu is clicked -->
    <p id="restriction-msg" class="restriction-warning"></p>

    <!-- Teacher Control Panel to block/unblock menus -->
    <div class="teacher-controls">
      <h3>Teacher Menu Restrictions</h3>
      <label><input type="checkbox" id="block-bk"> Block Burger King</label>
      <label><input type="checkbox" id="block-pizza"> Block Sun Pizza</label>
      <label><input type="checkbox" id="block-bps"> Block BPS School Lunch</label>
    </div>
    <!-- Menu Option Cards placed INSIDE Page 2 so they stay hidden until ORDER HERE is clicked -->
    <div class="menu-options-container">
      <!-- Option 1: Burger King -->
      <div class="menu-options-container">
    </div>
  </div> <!-- End of Page 2: menu-select-screen -->

  <!-- Page 3: Burger King Menu Screen (starts hidden) -->
  <div id="bk-menu-screen" class="screen hidden">
    <h2 class="section-title">BURGER KING MENU</h2>
    <div class="menu-items-list">
      <button class="food-item-btn" onclick="addToCart('Whopper Meal', 8.50)">Whopper Meal — $8.50</button>
      <button class="food-item-btn" onclick="addToCart('Chicken Nuggets (8 pc)', 4.50)">Chicken Nuggets (8 pc) — $4.50</button>
      <button class="food-item-btn" onclick="addToCart('Medium Fries', 2.75)">Medium Fries — $2.75</button>
    </div>
    <button class="back-btn" onclick="goBackToOptions()">← Back to Options</button>
  </div>

  <!-- Page 4: Sun Pizza Menu Screen (starts hidden) -->
  <div id="pizza-menu-screen" class="screen hidden">
    <h2 class="section-title">SUN PIZZA MENU</h2>
    <div class="menu-items-list">
      <button class="food-item-btn" onclick="addToCart('Cheese Pizza Slice', 3.50)">Cheese Pizza Slice — $3.50</button>
      <button class="food-item-btn" onclick="addToCart('Pepperoni Pizza Slice', 4.00)">Pepperoni Pizza Slice — $4.00</button>
      <button class="food-item-btn" onclick="addToCart('Italian Sub', 7.25)">Italian Sub — $7.25</button>
    </div>
    <button class="back-btn" onclick="goBackToOptions()">← Back to Options</button>
  </div>

  <!-- Page 5: BPS School Lunch Menu Screen (starts hidden) -->
  <div id="bps-menu-screen" class="screen hidden">
    <h2 class="section-title">BPS SCHOOL LUNCH MENU</h2>
    <div class="menu-items-list">
      <button class="food-item-btn" onclick="addToCart('Turkey & Cheese Wrap', 3.00)">Turkey & Cheese Wrap — $3.00</button>
      <button class="food-item-btn" onclick="addToCart('Garden Salad & Apple', 2.75)">Garden Salad & Apple — $2.75</button>
      <button class="food-item-btn" onclick="addToCart('Chicken Pasta Bowl', 3.25)">Chicken Pasta Bowl — $3.25</button>
    </div>
    <button class="back-btn" onclick="goBackToOptions()">← Back to Options</button>
  </div>

  <!-- Shared Order Cart & Checkout Box (starts hidden until user opens a menu) -->
  <div id="cart-section" class="cart-box hidden">
    <h3>Your Lunch Order</h3>
    <ul id="cart-items-list"></ul>
    <p class="cart-total">Total: $<span id="cart-total">0.00</span></p>
    <button id="checkout-btn" class="checkout-button" onclick="checkoutOrder()">PLACE ORDER</button>
    <p id="checkout-feedback" class="checkout-message"></p>
  </div>
